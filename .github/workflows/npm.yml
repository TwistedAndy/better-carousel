# Publish the package to npm when a GitHub release is published
name: npm

on:
  release:
    types: [published]
  workflow_dispatch:

# trusted publishing signs in to npm with the GitHub OIDC token, no npm token is stored
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # trusted publishing needs npm 11.5.1 or newer, which comes with Node 24
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # dist is committed, so the package is published as it is in the release
      - name: Check the version
        if: github.event_name == 'release'
        run: test "v$(node -p 'require("./package.json").version')" = "${{ github.event.release.tag_name }}"

      # npm refuses a version that it has, so a second run or a version published by hand does not fail the workflow
      - name: Check npm
        id: npm
        run: |
          package="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if npm view "$package" version > /dev/null 2>&1; then
            echo "$package is on npm already"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.npm.outputs.published != 'true'
        run: npm publish
