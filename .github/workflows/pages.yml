# Build the library and the docs page, and publish the page to GitHub Pages
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# keep one deployment at a time, a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # package-lock.json is not in git, so npm ci cannot run
      - run: npm install --no-audit --no-fund

      - run: npm run build

      # publish only what the page loads, not the sources or node_modules
      - name: Collect the site
        run: |
          mkdir -p _site/demo
          cp -r index.html dist _site/
          cp -r demo/demo.js demo/demo.css demo/assets demo/images _site/demo/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # a separate job: in the same job, the deploy step can start before the artifact is available
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
